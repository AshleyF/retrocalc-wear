plugins {
    id 'com.android.application'
}

android {
    namespace 'org.feniello.retrocalc'
    compileSdk 37

    defaultConfig {
        applicationId 'org.feniello.retrocalc'
        minSdk 30
        targetSdk 37
        versionCode 3
        versionName '1.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def keystorePath = System.getenv('RETRO_KEYSTORE')
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('RETRO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RETRO_KEY_ALIAS')
                keyPassword System.getenv('RETRO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
